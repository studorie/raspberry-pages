<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 210">
<defs>
  <radialGradient id="berry" cx="30%" cy="25%" r="75%">
    <stop offset="0" stop-color="#fa75a8"/>
    <stop offset=".38" stop-color="#e7377d"/>
    <stop offset=".78" stop-color="#b3165b"/>
    <stop offset="1" stop-color="#7b093d"/>
  </radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#89a85f"/>
    <stop offset=".55" stop-color="#58783f"/>
    <stop offset="1" stop-color="#314b29"/>
  </linearGradient>
  <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#829d59"/>
    <stop offset="1" stop-color="#415d31"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#310017" flood-opacity=".30"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation=".35"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <path d="M91 30 C92 15 101 7 111 2 C109 17 105 28 98 39" fill="none" stroke="url(#stem)" stroke-width="7" stroke-linecap="round"/>
  <path d="M87 42 C66 28 52 22 35 26 C46 42 60 49 81 49Z" fill="url(#leaf)"/>
  <path d="M97 41 C116 25 137 23 153 31 C140 45 123 51 102 49Z" fill="url(#leaf)"/>
  <path d="M91 48 C78 31 75 21 79 11 C92 24 97 35 96 49Z" fill="url(#leaf)"/>
  <path d="M94 48 C106 31 111 23 122 18 C121 34 111 44 100 51Z" fill="url(#leaf)"/>

  <!-- drupelets -->
  <g stroke="#871047" stroke-width="1.2">
    <circle cx="91" cy="59" r="18" fill="url(#berry)"/>
    <circle cx="70" cy="70" r="18" fill="url(#berry)"/>
    <circle cx="112" cy="70" r="18" fill="url(#berry)"/>
    <circle cx="52" cy="88" r="18" fill="url(#berry)"/>
    <circle cx="91" cy="88" r="19" fill="url(#berry)"/>
    <circle cx="130" cy="88" r="18" fill="url(#berry)"/>
    <circle cx="42" cy="111" r="18" fill="url(#berry)"/>
    <circle cx="72" cy="111" r="19" fill="url(#berry)"/>
    <circle cx="110" cy="111" r="19" fill="url(#berry)"/>
    <circle cx="140" cy="111" r="18" fill="url(#berry)"/>
    <circle cx="55" cy="136" r="18" fill="url(#berry)"/>
    <circle cx="91" cy="136" r="19" fill="url(#berry)"/>
    <circle cx="127" cy="136" r="18" fill="url(#berry)"/>
    <circle cx="69" cy="159" r="17" fill="url(#berry)"/>
    <circle cx="112" cy="159" r="17" fill="url(#berry)"/>
    <circle cx="91" cy="180" r="15" fill="url(#berry)"/>
  </g>

  <!-- subtle highlights -->
  <g fill="#ffd0df" opacity=".34" filter="url(#soft)">
    <ellipse cx="84" cy="52" rx="5" ry="3"/>
    <ellipse cx="63" cy="64" rx="5" ry="3"/>
    <ellipse cx="105" cy="64" rx="5" ry="3"/>
    <ellipse cx="45" cy="82" rx="5" ry="3"/>
    <ellipse cx="83" cy="81" rx="6" ry="3"/>
    <ellipse cx="122" cy="82" rx="5" ry="3"/>
    <ellipse cx="35" cy="105" rx="5" ry="3"/>
    <ellipse cx="65" cy="104" rx="6" ry="3"/>
    <ellipse cx="103" cy="104" rx="6" ry="3"/>
  </g>
</g>
</svg>